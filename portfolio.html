<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>David Zalazar | Mechanical Design Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f1;
      --surface: #ffffff;
      --border: #e2e0db;
      --text-primary: #1a1916;
      --text-secondary: #6b6860;
      --accent: #2a6049;
      --accent-light: #e8f0ec;
      --tag-bg: #ededea;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    header {
      padding: 64px 64px 48px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      animation: fadeUp 0.6s ease both;
    }

    .header-left h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .header-left h1 em {
      color: var(--accent);
      font-style: italic;
    }

    .header-left p {
      margin-top: 12px;
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 300;
      max-width: 480px;
      line-height: 1.6;
    }

    .header-right { text-align: right; }

    .header-right .name {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .header-right .contact {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--accent);
    }

    .filter-bar {
      padding: 20px 64px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.6s 0.1s ease both;
    }

    .filter-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1px;
      background: var(--border);
    }

    .card {
      background: var(--surface);
      cursor: pointer;
      transition: background 0.2s;
      animation: fadeUp 0.5s ease both;
    }

    .card:hover { background: #fafaf8; }

    .card-img {
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: #f0efec;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .card:hover .card-img img { transform: scale(1.02); }

    .card-body { padding: 20px 24px 24px; }

    .card-body h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.3;
    }

    .card-body p {
      margin-top: 6px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.55;
      font-weight: 300;
    }

    .card-meta {
      margin-top: 14px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-light);
      padding: 3px 9px;
      border-radius: 4px;
    }

    footer {
      padding: 32px 64px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    footer p {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 300;
    }

    .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 8px;
      vertical-align: middle;
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26,25,22,0.88);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 32px;
      backdrop-filter: blur(6px);
    }

    .lightbox.open { display: flex; }

    .lightbox-inner {
      background: var(--surface);
      max-width: 860px;
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
      animation: scaleIn 0.2s ease;
    }

    .lightbox-img {
      width: 100%;
      background: #f0efec;
    }

    .lightbox-img img {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      display: block;
    }

    .lightbox-body { padding: 24px 28px 28px; }

    .lightbox-body h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      font-weight: 400;
    }

    .lightbox-body p {
      margin-top: 8px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .lightbox-body .card-meta { margin-top: 16px; }

    .lightbox-close {
      position: fixed;
      top: 24px; right: 28px;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: #fff;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
      line-height: 1;
    }

    .lightbox-close:hover { opacity: 1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.15s; }
    .card:nth-child(4) { animation-delay: 0.2s; }

    @media (max-width: 640px) {
      header, .filter-bar, footer { padding-left: 24px; padding-right: 24px; }
      header { flex-direction: column; align-items: flex-start; }
      .header-right { text-align: left; }
    }
  
    /* Gallery additions; keep the original typography and colors. */
    [hidden] { display: none !important; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card { border: 0; color: inherit; font: inherit; text-align: left; width: 100%; }
    .card-img { background: white; }
    .card-img img { object-fit: contain; padding: 16px; }
    .card-body { display: block; }
    .card-body h2 { font: 400 1.2rem 'DM Serif Display', serif; }
    .view-project { display: block; margin-top: 18px; color: var(--accent); font-size: .85rem; font-weight: 500; }
    .contact a { color: inherit; text-decoration: none; }
    dialog { border: 0; border-radius: 8px; padding: 0; margin: auto; width: min(1000px, calc(100% - 32px)); max-height: calc(100dvh - 32px); background: var(--surface); color: var(--text-primary); }
    dialog::backdrop { background: rgba(26,25,22,.88); backdrop-filter: blur(5px); }
    .gallery-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 18px 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: white; z-index: 2; }
    .gallery-header h2 { font: 400 1.4rem 'DM Serif Display', serif; }
    .gallery-close { border: 1px solid var(--border); border-radius: 50%; width: 44px; height: 44px; flex: 0 0 44px; background: white; font-size: 1.5rem; cursor: pointer; }
    .gallery-stage { background: #fff; }
    .gallery-stage img { display: block; width: 100%; height: clamp(220px, 47vh, 520px); object-fit: contain; padding: 20px; }
    .gallery-controls { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 24px; border-top: 1px solid var(--border); }
    .gallery-controls button { font: inherit; font-size: .85rem; min-height: 44px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 5px; background: white; color: var(--accent); cursor: pointer; }
    .gallery-controls button:disabled { opacity: .35; cursor: default; }
    #gallery-counter { font-size: .8rem; color: var(--text-secondary); }
    .gallery-caption { padding: 0 24px 16px; font-size: .9rem; line-height: 1.6; color: var(--text-secondary); }
    .gallery-thumbs { display: flex; overflow-x: auto; gap: 10px; padding: 0 24px 20px; }
    .gallery-thumbs button { flex: 0 0 90px; border: 2px solid var(--border); background: white; border-radius: 4px; padding: 3px; cursor: pointer; }
    .gallery-thumbs button[aria-current="true"] { border-color: var(--accent); }
    .gallery-thumbs img { width: 80px; height: 60px; object-fit: contain; display: block; }
    .gallery-details { padding: 22px 24px 28px; border-top: 1px solid var(--border); }
    .gallery-details p { font-size: .92rem; line-height: 1.65; max-width: 780px; }
    .gallery-details .contribution { margin-top: 12px; color: var(--text-secondary); }
    .image-error { padding: 60px 24px; text-align: center; color: var(--text-secondary); }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } header { padding-top: 36px; padding-bottom: 30px; } .gallery-header { padding: 12px 16px; } .gallery-header h2 { font-size: 1.15rem; } .gallery-controls, .gallery-details { padding-left: 16px; padding-right: 16px; } .gallery-stage img { padding: 12px; height: 36vh; min-height: 200px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Mechanical Design<br/><em>Work Samples</em></h1>
      <p>Medical device components and assemblies designed in SolidWorks, with selected work spanning CAD, prototyping, and fabricated parts.</p>
    </div>
    <div class="header-right">
      <div class="name">David Zalazar</div>
      <div class="contact"><a href="mailto:zalazar.david815@gmail.com">zalazar.david815@gmail.com</a></div>
    </div>
  </header>
  <main>
    <nav class="filter-bar" aria-label="Filter projects">
      <button class="filter-btn active" data-filter="all" aria-pressed="true">All projects</button>
      <button class="filter-btn" data-filter="assembly" aria-pressed="false">Assemblies</button>
      <button class="filter-btn" data-filter="component" aria-pressed="false">Components</button>
      <button class="filter-btn" data-filter="container" aria-pressed="false">Containers</button>
    </nav>
    <div class="grid" id="grid"></div>
    <noscript><p style="padding:24px">Please enable JavaScript to view the project galleries.</p></noscript>
  </main>
  <footer><p><span class="dot"></span>David Zalazar — SolidWorks Work Samples</p></footer>

  <dialog id="gallery" aria-labelledby="gallery-title">
    <div class="gallery-header">
      <h2 id="gallery-title"></h2>
      <button class="gallery-close" type="button" aria-label="Close project gallery" autofocus>&times;</button>
    </div>
    <figure>
      <div class="gallery-stage"><img id="gallery-image" alt=""/><p id="image-error" class="image-error" hidden>Image unavailable. Please try another view.</p></div>
      <div class="gallery-controls">
        <button id="previous" type="button" aria-label="Previous image">&#8592; Previous</button>
        <span id="gallery-counter" role="status" aria-live="polite"></span>
        <button id="next" type="button" aria-label="Next image">Next &#8594;</button>
      </div>
      <figcaption class="gallery-caption" id="gallery-caption"></figcaption>
    </figure>
    <div class="gallery-thumbs" id="gallery-thumbs" aria-label="Select an image"></div>
    <div class="gallery-details">
      <p id="gallery-description"></p>
      <p id="gallery-contribution" class="contribution"></p>
      <div class="card-meta" id="gallery-tags"></div>
    </div>
  </dialog>

  <script>
    /* ==============================================================
       EDIT YOUR PROJECTS HERE
       Keep this HTML and the images in the same GitHub Pages folder.
       Each gallery item is { src: 'filename.png', alt: 'description',
                              caption: 'Text shown beneath this image' }.
       Optional images below are already configured. Upload files with
       those EXACT names (case-sensitive), or change src to your filename.
       Missing optional files are quietly skipped: visitors see only real images.
       Existing images stay visible while you prepare the other views.
       You may add, remove, or reorder images in any gallery array.
       Update captions and contributions to describe your actual work.
       ============================================================== */
    const projects = [
      {
        id: 'ett', title: 'Secure-Swap ETT Holder', categories: ['assembly'],
        thumbnail: 'Secure-swap.png',
        summary: 'Multi-component endotracheal tube holder with a locking rail and adjustable clamp. The project progressed to injection molded parts.',
        description: 'An endotracheal tube management assembly incorporating a rail mount, adjustable clamp, tubing, and strap. CAD views and fabricated parts document the assembly.',
        contribution: 'My contribution: CAD part design. Injection mold tooling was designed by others.',
        tags: ['SolidWorks', 'Assembly', 'Injection molding'],
        gallery: [
          {src: 'Secure-swap.png', alt: 'Secure-Swap ETT holder CAD assembly', caption: 'CAD assembly showing the rail, clamp, and tube arrangement.'},
          {src: 'ETT_Molded_Parts.jpg', optional: true, alt: 'Injection molded ETT holder components', caption: 'Injection molded components from the ETT holder project. Mold tooling was designed by others.'},
          {src: 'ETT_Prototype.jpg', optional: true, alt: 'Assembled ETT holder prototype', caption: 'Physical prototype showing the assembled components.'}
        ]
      },
      {
        id: 'cap', title: 'PD Three-Nozzle Cap', categories: ['assembly', 'component'],
        thumbnail: 'PD_3_nozzle_Cap.png',
        summary: 'Original cap design for lipoaspirate washing, with three fluid connections and internal routing. Integrated with a modified existing cylindrical body.',
        description: 'A three-nozzle cap designed for a lipoaspirate washing device. The complete assembly provides context for the cap and its connection to the cylindrical body.',
        contribution: 'My contribution: conceived and designed the cap. Modified an existing body design by rounding the spiral baffles and limiting them to the upper 60% of the interior.',
        tags: ['SolidWorks', 'Fluid routing', 'Prototype'],
        gallery: [
          {src: 'PD_Full_Assembly.png', optional: true, alt: 'Complete cap and cylindrical body assembly', caption: 'Full device assembly. I designed the cap and modified the baffles in an existing cylindrical body design.'},
          {src: 'PD_3_nozzle_Cap.png', alt: 'Three-nozzle cap CAD view', caption: 'Original cap design showing the fluid connections and routing geometry.'},
          {src: 'PD_Cap_Section.png', optional: true, alt: 'Cap cross-section with selected dimensions', caption: 'Cap cross-section with selected dimensions showing the internal passages and interface geometry.'},
          {src: 'PD_Cap_Prototype.jpg', optional: true, alt: 'Fabricated cap prototype', caption: 'Physical prototype of the cap design.'}
        ]
      },
      {
        id: 'saline', title: 'Saline Container Assembly', categories: ['assembly', 'container'],
        thumbnail: 'Autoclavable_Saline_Container.png',
        summary: 'Container assembly with volume markings, a barbed outlet, a flanged lid, and a supporting base.',
        description: 'SolidWorks assembly showing the container, lid, outlet fitting, and base. The transparent CAD view exposes the internal geometry and outlet routing.',
        contribution: '', // Add your specific design contribution and any verified testing here.
        tags: ['SolidWorks', 'Assembly', 'Container'],
        gallery: [
          {src: 'Autoclavable_Saline_Container.png', alt: 'Saline container CAD assembly', caption: 'CAD assembly with a transparent body to reveal the internal geometry.'},
          {src: 'Saline_Prototype.jpg', optional: true, alt: 'Saline container prototype', caption: 'Physical prototype of the saline container assembly.'}
        ]
      }
    ];

    const grid = document.getElementById('grid');
    const dialog = document.getElementById('gallery');
    const mainImage = document.getElementById('gallery-image');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    const thumbStrip = document.getElementById('gallery-thumbs');
    let slides = [], position = 0, requestId = 0, opener = null, previousOverflow = '';

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function appendTags(container, tags) {
      container.replaceChildren(...tags.map(tag => element('span', 'tag', tag)));
    }
    projects.forEach(project => {
      const card = element('button', 'card');
      card.type = 'button'; card.dataset.categories = project.categories.join(' ');
      card.setAttribute('aria-label', 'View ' + project.title + ' gallery');
      card.setAttribute('aria-haspopup', 'dialog');
      const imageBox = element('div', 'card-img');
      const image = element('img'); image.src = project.thumbnail; image.alt = project.title; image.loading = 'lazy';
      imageBox.append(image);
      const body = element('div', 'card-body');
      body.append(element('h2', '', project.title), element('p', '', project.summary));
      const tags = element('div', 'card-meta'); appendTags(tags, project.tags);
      body.append(tags, element('span', 'view-project', 'Explore project →'));
      card.append(imageBox, body); grid.append(card);
      card.addEventListener('click', () => openGallery(project, card));
    });
    document.querySelectorAll('[data-filter]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-filter]').forEach(item => {
          item.classList.toggle('active', item === button);
          item.setAttribute('aria-pressed', String(item === button));
        });
        document.querySelectorAll('.card').forEach(card => {
          card.hidden = button.dataset.filter !== 'all' && !card.dataset.categories.split(' ').includes(button.dataset.filter);
        });
      });
    });
    const imageAvailability = new Map();
    function canLoad(src) {
      if (!imageAvailability.has(src)) imageAvailability.set(src, new Promise(resolve => {
        const image = new Image();
        const timeout = setTimeout(() => resolve(false), 6000);
        image.onload = () => { clearTimeout(timeout); resolve(true); };
        image.onerror = () => { clearTimeout(timeout); resolve(false); };
        image.src = src;
      }));
      return imageAvailability.get(src);
    }
    function buildThumbnails() {
      thumbStrip.replaceChildren();
      slides.forEach((slide, index) => {
        const button = element('button'); button.type = 'button';
        button.setAttribute('aria-label', 'View image ' + (index + 1) + ': ' + slide.alt);
        const image = element('img'); image.src = slide.src; image.alt = '';
        button.append(image); button.addEventListener('click', () => showSlide(index));
        thumbStrip.append(button);
      });
      thumbStrip.hidden = slides.length < 2;
    }
    function showSlide(index) {
      position = (index + slides.length) % slides.length;
      const slide = slides[position];
      mainImage.hidden = false; document.getElementById('image-error').hidden = true;
      mainImage.alt = slide.alt; mainImage.src = slide.src;
      document.getElementById('gallery-caption').textContent = slide.caption;
      document.getElementById('gallery-counter').textContent = `${position + 1} / ${slides.length}`;
      previous.disabled = next.disabled = slides.length < 2;
      [...thumbStrip.children].forEach((button, i) => button.setAttribute('aria-current', String(i === position)));
    }
    mainImage.addEventListener('error', () => {
      mainImage.hidden = true; document.getElementById('image-error').hidden = false;
    });
    async function openGallery(project, card) {
      const thisRequest = ++requestId; opener = card;
      document.getElementById('gallery-title').textContent = project.title;
      document.getElementById('gallery-description').textContent = project.description;
      const contribution = document.getElementById('gallery-contribution');
      contribution.textContent = project.contribution; contribution.hidden = !project.contribution;
      appendTags(document.getElementById('gallery-tags'), project.tags);
      slides = project.gallery.filter(slide => !slide.optional);
      buildThumbnails(); showSlide(0);
      previousOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden'; dialog.showModal(); dialog.scrollTop = 0;
      // Load future photos/drawings in the background; no empty public placeholders.
      const available = await Promise.all(project.gallery.map(async slide => !slide.optional || await canLoad(slide.src)));
      if (!dialog.open || thisRequest !== requestId) return;
      const selectedSrc = slides[position].src;
      slides = project.gallery.filter((slide, index) => available[index]);
      buildThumbnails(); showSlide(Math.max(0, slides.findIndex(slide => slide.src === selectedSrc)));
    }
    function closeGallery() { dialog.close(); }
    dialog.addEventListener('close', () => {
      ++requestId; document.body.style.overflow = previousOverflow; opener?.focus();
    });
    dialog.querySelector('.gallery-close').addEventListener('click', closeGallery);
    dialog.addEventListener('click', event => {
      const box = dialog.getBoundingClientRect();
      if (event.target === dialog && (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom)) closeGallery();
    });
    previous.addEventListener('click', () => showSlide(position - 1));
    next.addEventListener('click', () => showSlide(position + 1));
    dialog.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault(); showSlide(position + (event.key === 'ArrowRight' ? 1 : -1));
      }
    });
    // Native dialog provides Escape-to-close and contains keyboard focus.
    let touchStart = null;
    mainImage.addEventListener('touchstart', event => {
      touchStart = event.touches.length === 1 ? {x: event.touches[0].clientX, y: event.touches[0].clientY} : null;
    }, {passive: true});
    mainImage.addEventListener('touchend', event => {
      if (!touchStart || !event.changedTouches.length) return;
      const dx = event.changedTouches[0].clientX - touchStart.x;
      const dy = event.changedTouches[0].clientY - touchStart.y;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) showSlide(position + (dx < 0 ? 1 : -1));
      touchStart = null;
    }, {passive: true});
  </script>
</body>
</html>
